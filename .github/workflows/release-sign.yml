name: Release sign + attest

# Triggers on a v* tag push. Builds the wheel, signs it with cosign-keyless
# (Sigstore via GitHub OIDC), generates SLSA build-provenance attestation,
# uploads everything (wheel + .sha256 + .sig + .pem + attestation) to the
# GitHub Release that matches the tag.
#
# This is the orchestrator's "release pipeline" — once green, every install
# from `pipx install <wheel-url>` can be cryptographically traced back to a
# specific commit + workflow run. It does NOT publish to PyPI; that's a
# separate workflow gated on a manual approval (see release.yml).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write       # to upload to the release
  id-token: write       # to mint the OIDC token Sigstore needs
  attestations: write   # to record the SLSA attestation

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/

      - name: Compute sha256 sidecar
        run: |
          cd dist
          for f in *.whl; do
            shasum -a 256 "$f" | awk '{print $1}' > "$f.sha256"
          done

      - name: Sigstore-sign the wheel (keyless via OIDC)
        uses: sigstore/gh-action-sigstore-python@v3
        with:
          inputs: ./dist/*.whl
          upload-signing-artifacts: true

      - name: SLSA build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.whl"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" dist/*.whl dist/*.whl.sha256 dist/*.sigstore --clobber

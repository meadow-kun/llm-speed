[project]
name = "llm-speed"
version = "0.0.7"
description = "Benchmark any LLM on any hardware. CLI for the llm-speed.com flywheel."
requires-python = ">=3.10"
authors = [{name = "meadow-kun", email = "2424351+meadow-kun@users.noreply.github.com"}]
license = {text = "Apache-2.0"}
readme = "README.md"
keywords = [
    "llm",
    "benchmark",
    "inference",
    "tokens-per-second",
    "ollama",
    "llama.cpp",
    "vllm",
    "mlx",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: GPU",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
]
dependencies = [
    # Lower bounds pinned to known-CVE-fix versions, not arbitrary minimums.
    # cryptography 44.0.1 ships the fix for CVE-2024-12797 (OpenSSL); rich
    # 13.7 hardens terminal-escape handling. Upper bounds are kept loose so
    # Dependabot can bump.
    "httpx>=0.27,<0.30",
    "psutil>=5.9",
    "rich>=13.7",
    "cryptography>=44.0.1",
    "joserfc>=1.0",
]

[project.optional-dependencies]
seed = ["praw>=7.7,<8"]
mlx = ["mlx-lm>=0.18"]
vllm = ["vllm>=0.6"]
exllamav2 = ["exllamav2>=0.2"]
# `llm-speed mcp` boots a Model Context Protocol stdio server so AI
# assistants (Claude Desktop, Cline, Cursor, etc.) can query the
# leaderboard inline. Optional because most CLI users won't run it.
mcp = ["mcp>=1.10", "cachetools>=5"]
test = ["pytest>=8", "pytest-cov>=5", "jsonschema==4.26.0", "rfc3339-validator==0.1.4"]

[project.urls]
Homepage = "https://llm-speed.com"
# Public CLI repo (Apache-2.0). The private orchestrator's GitHub URL
# was here in an earlier commit and would have rendered as a 404 button
# on the PyPI listing — F-2 in the 2026-05-07 forensic audit.
Source = "https://github.com/meadow-kun/llm-speed"
Documentation = "https://llm-speed.com/methodology"
Issues = "https://github.com/meadow-kun/llm-speed/issues"

[project.scripts]
llm-speed = "cli.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# CLI-only. The orchestrator's `seed/` package is intentionally NOT
# shipped — it's the Reddit/HN scraper code and lives only in the
# private orchestrator. Keeping `seed*` out of this list is a
# defence-in-depth so a future build that accidentally has `seed/` on
# disk doesn't silently package + ship it as a top-level importable
# module on every user's machine.
include = ["cli*"]

[tool.pyright]
include = ["seed", "cli"]
pythonVersion = "3.10"
reportMissingImports = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
